<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maziwa Printer PRO</title><style>body{font-family:Arial;background:#0a0a0a;color:#fff;padding:10px;margin:0}h1{color:#00ff88;margin:10px;text-align:center}.card{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:12px;margin:10px 0}input,select{width:100%;padding:12px;margin:8px 0;border-radius:8px;background:#000;color:#fff;border:1px solid #333;box-sizing:border-box}button{width:100%;padding:14px;border-radius:12px;border:none;font-weight:bold;font-size:16px;margin:5px 0}.start{background:#00ff88;color:#000}.stop{background:#ff4444;color:#fff}#log{background:#000;height:200px;overflow:auto;font-size:11px;padding:8px;border-radius:8px}.badge{padding:3px 8px;border-radius:20px;font-size:11px;background:#222;margin:2px;display:inline-block}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.profit{color:#00ff88}.loss{color:#ff4444}</style></head><body><h1>🥛 Maziwa Printer PRO</h1><p style="text-align:center">Deriv Auto Trader - AI Scanner Live</p><div class="card"><input id="token" placeholder="Deriv API Token (paste here)"><div class="grid2"><select id="market"><option value="R_10">Volatility 10</option><option value="R_25">Volatility 25</option><option value="R_50">Volatility 50</option><option value="R_75">Volatility 75</option><option value="R_100" selected>Volatility 100</option><option value="1HZ10V">Vol 10 (1s)</option><option value="1HZ25V">Vol 25 (1s)</option></select><input id="stake" type="number" value="1" placeholder="Stake $"></div><select id="type"><option value="CALL">Rise ↑</option><option value="PUT">Fall ↓</option><option value="DIGITEVEN">Even</option><option value="DIGITODD">Odd</option><option value="DIGITOVER">Over</option><option value="DIGITUNDER">Under</option><option value="DIGITMATCH">Matches</option><option value="DIGITDIFF">Differs</option></select><div class="grid2"><select id="digit"><option value="">AI Auto Digit</option><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option></select><input id="barrier" placeholder="Barrier/Target (e.g 5)"></div><div class="grid2"><label><input type="checkbox" id="marti" checked> Martingale x2.1</label><label><input type="checkbox" id="ai" checked> AI Scanner ON</label></div><input id="target" type="number" value="20" placeholder="Target Profit $"><button class="start" onclick="start()">▶ START PRINTING</button><button class="stop" onclick="stop()">■ STOP</button></div><div class="card"><b>🤖 AI SCANNER LIVE</b><div id="aiBox" style="border-left:3px solid #00ff88;padding-left:8px;margin:5px 0">Waiting for ticks...</div><div id="digits" style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px"></div></div><div class="card"><b>📊 STATS</b> Profit: <span id="p" class="profit">$0.00</span> | Trades: <span id="c">0</span> | WinRate: <span id="w">0%</span><div id="bal" class="badge">Balance: -</div><div id="log"></div></div><script>let ws,run=false,profit=0,trades=0,wins=0,lastDigit=-1,history=[],stake0=1,curStake=1;const log=m=>{let l=document.getElementById('log');l.innerHTML+=`<br>${new Date().toLocaleTimeString()} ${m}`;l.scrollTop=9999};const digitOf=q=>{let s=q.toString().split('.')[1]||q.toString();return parseInt(s[s.length-1])||0};function start(){let t=document.getElementById('token').value.trim();if(!t)return alert('Paste Deriv Token First!');stake0=parseFloat(document.getElementById('stake').value)||1;curStake=stake0;run=true;profit=0;trades=0;wins=0;history=[];log('Connecting...');ws=new WebSocket('wss://ws.binaryws.com/websockets/v3?app_id=1089');ws.onopen=()=>ws.send(JSON.stringify({authorize:t}));ws.onmessage=e=>{let d=JSON.parse(e.data);if(d.error){log('❌ '+d.error.message);return}if(d.authorize){document.getElementById('bal').innerText='Balance: $'+d.authorize.balance;log('✅ Authorized Balance $'+d.authorize.balance);ws.send(JSON.stringify({ticks:document.getElementById('market').value}))}if(d.tick){let dg=digitOf(d.tick.quote);lastDigit=dg;history.push(dg);if(history.length>100)history.shift();updateAI();if(run)doTradeAI()}if(d.buy){log(`🔵 BUY ${d.buy.contract_type} $${d.buy.buy_price}`);ws.send(JSON.stringify({proposal_open_contract:1,contract_id:d.buy.contract_id,subscribe:1}))}if(d.proposal_open_contract&&d.proposal_open_contract.is_sold){let pl=parseFloat(d.proposal_open_contract.profit);profit+=pl;trades++;if(pl>0)wins++;document.getElementById('p').innerText='$'+profit.toFixed(2);document.getElementById('c').innerText=trades;document.getElementById('w').innerText=(trades?Math.round(wins/trades*100):0)+'%';if(pl>0){log(`<span class=profit>✅ WIN +$${pl.toFixed(2)} Profit $${profit.toFixed(2)}</span>`);curStake=stake0}else{log(`<span class=loss>❌ LOSS $${pl.toFixed(2)} Profit $${profit.toFixed(2)}</span>`);if(document.getElementById('marti').checked)curStake=(curStake*2.1).toFixed(2)}if(profit>=parseFloat(document.getElementById('target').value)){log('🎯 TARGET REACHED! Stopping');stop()}}}}function updateAI(){if(history.length<10)return;let cnt=Array(10).fill(0);history.slice(-25).forEach(x=>cnt[x]++);let even=history.slice(-25).filter(x=>x%2==0).length;let most=cnt.indexOf(Math.max(...cnt));let least=cnt.indexOf(Math.min(...cnt));document.getElementById('aiBox').innerHTML=`Last: <b>${lastDigit}</b> | Even ${even}/25 | Hot:${most} Cold:${least} | Last 5: ${history.slice(-5).join(',')}`;let html='';for(let i=0;i<10;i++)html+=`<span class=badge style="${i==least?'background:#00ff88;color:#000':''}">${i}:${cnt[i]}</span>`;document.getElementById('digits').innerHTML=html}let lastTrade=0;function doTradeAI(){let now=Date.now();if(now-lastTrade<3500)return;lastTrade=now;if(history.length<20)return;let selType=document.getElementById('type').value;let barrier=document.getElementById('barrier').value||document.getElementById('digit').value||'5';if(document.getElementById('ai').checked){let cnt=Array(10).fill(0);history.slice(-25).forEach(x=>cnt[x]++);let least=cnt.indexOf(Math.min(...cnt));let even=history.slice(-25).filter(x=>x%2==0).length;if(even>=18){selType='DIGITEVEN';barrier=''}else if(even<=7){selType='DIGITODD';barrier=''}else{selType='DIGITDIFF';barrier=least}}let params={amount:parseFloat(curStake),basis:'stake',currency:'USD',duration:1,duration_unit:'t',symbol:document.getElementById('market').value,contract_type:selType};if(['DIGITMATCH','DIGITDIFF','DIGITOVER','DIGITUNDER'].includes(selType))params.barrier=parseInt(barrier);if(ws)ws.send(JSON.stringify({buy:1,price:params.amount,parameters:params}))}function stop(){run=false;if(ws)ws.close();log('🛑 STOPPED Total $'+profit.toFixed(2))}</script></body></html>
