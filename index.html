<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maziwa FIXED</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-black flex justify-center"><div class="w-full max-w-[430px] bg-[#0a0a0a] min-h-screen p-3"><h1 class="font-black text-white text-xl">🥛 Maziwa <span class="text-emerald-400">FIXED PRO</span></h1><p id="st" class="text-yellow-400 text-xs mt-2">Connecting...</p><p id="live" class="text-emerald-400 text-sm font-bold mt-1">-</p><select id="mk" class="w-full mt-3 bg-[#111] border border-[#333] rounded-xl p-3 text-white text-sm"><option value="R_100">Vol 100</option><option value="R_10">Vol 10</option><option value="1HZ100V">Vol 100 (1s)</option></select><button onclick="analyze()" class="w-full mt-3 bg-emerald-500 text-black font-black py-3 rounded-full">SCAN NOW</button><div class="grid grid-cols-2 gap-2 mt-3"><div class="bg-[#111] border border-[#222] rounded-xl p-3"><p class="text-[10px] text-gray-400">EVEN</p><p id="eP" class="text-white font-black text-2xl">0%</p></div><div class="bg-[#111] border border-[#222] rounded-xl p-3"><p class="text-[10px] text-gray-400">ODD</p><p id="oP" class="text-white font-black text-2xl">0%</p></div><div class="bg-[#111] border border-[#222] rounded-xl p-3"><p class="text-[10px] text-gray-400">MATCHES</p><p id="mP" class="text-white font-black text-2xl">0%</p></div><div class="bg-[#111] border border-[#222] rounded-xl p-3"><p class="text-[10px] text-gray-400">DIFFERS</p><p id="dP" class="text-white font-black text-2xl">0%</p></div></div><div id="last" class="flex flex-wrap gap-1 mt-3"></div><div id="grid" class="grid grid-cols-5 gap-1 mt-2"></div><p id="sig" class="text-emerald-400 font-black mt-3 text-center"></p></div><script>let t=[],c=Array(10).fill(0),ws;function conn(){let m=document.getElementById('mk').value; if(ws)ws.close(); t=[]; c=Array(10).fill(0); document.getElementById('st').innerText='Connecting '+m+'...'; ws=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089'); ws.onopen=()=>{ws.send(JSON.stringify({ticks_history:m,count:100,end:'latest',style:'ticks'})); ws.send(JSON.stringify({ticks:m,subscribe:1}));}; ws.onmessage=(e)=>{let d=JSON.parse(e.data); if(d.history){d.history.prices.forEach(p=>{let dg=parseInt(String(p).slice(-1)); if(!isNaN(dg)){t.push(dg); c[dg]++;}}); document.getElementById('st').innerText='Loaded '+t.length+' ticks LIVE'; upd(); analyze();} if(d.tick){let q=d.tick.quote; let dg=parseInt(String(q).slice(-1)); document.getElementById('live').innerText=q+' | Digit '+dg; t.push(dg); if(t.length>100)t.shift(); if(!isNaN(dg))c[dg]++; upd();}}; }function upd(){let tot=t.length||1; document.getElementById('grid').innerHTML=''; for(let i=0;i<10;i++){let p=(c[i]/tot*100).toFixed(1); document.getElementById('grid').innerHTML+=`<div class="bg-black border border-[#222] rounded p-1 text-center"><p class="text-white text-xs font-bold">${i}</p><p class="text-cyan-400 text-[9px]">${p}%</p></div>`;} document.getElementById('last').innerHTML=t.slice(-20).map(x=>`<span class="w-6 h-6 bg-[#222] rounded-full flex items-center justify-center text-white text-xs">${x}</span>`).join('');}function analyze(){let tot=t.length; if(tot<5)return; let ev=t.filter(x=>x%2==0).length; let od=tot-ev; let mt=0; for(let i=1;i<t.length;i++)if(t[i]==t[i-1])mt++; let df=tot-1-mt; document.getElementById('eP').innerText=(ev/tot*100).toFixed(1)+'%'; document.getElementById('oP').innerText=(od/tot*100).toFixed(1)+'%'; document.getElementById('mP').innerText=(mt/(tot-1)*100).toFixed(1)+'%'; document.getElementById('dP').innerText=(df/(tot-1)*100).toFixed(1)+'%'; document.getElementById('sig').innerText=ev>od?'BUY EVEN '+ (ev/tot*100).toFixed(0)+'%':'BUY ODD '+ (od/tot*100).toFixed(0)+'%';}document.getElementById('mk').addEventListener('change',conn); conn(); setInterval(analyze,2000);</script></body></html>
