<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maziwa Printer PRO</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#020d08] flex justify-center"><div class="w-full max-w-[430px] bg-[#0a0a0a] min-h-screen border-x border-[#1f1f1f]"><div class="p-5 flex justify-between items-center"><h1 class="font-black text-white text-xl">🥛 Maziwa Printer <span class="text-emerald-400">PRO</span></h1><span class="text-[9px] bg-emerald-900/40 border border-emerald-800 text-emerald-400 px-2 py-1 rounded-full font-bold">PRO</span></div><div class="mx-4 p-4 rounded-[20px] bg-gradient-to-br from-[#123524] to-[#0a1a1a] border border-emerald-900/40"><div class="flex justify-between"><p class="text-[11px] text-gray-400">AI Scanner Status</p><span class="bg-emerald-500 text-black px-3 py-1 rounded-full text-[10px] font-black">ONLINE</span></div><p class="font-bold text-white text-sm mt-1">Scanning Markets • Active</p><div class="grid grid-cols-3 mt-3 pt-3 border-t border-white/10"><div><p class="text-[10px] text-gray-400">Today's P&L</p><p id="pnl" class="text-emerald-400 font-black">+$0.00</p></div><div><p class="text-[10px] text-gray-400">Win Rate</p><p class="font-black text-white">84%</p></div><div><p class="text-[10px] text-gray-400">Trades</p><p id="tr" class="font-black text-white">0</p></div></div></div><div class="m-4 bg-[#141414] border border-[#222] rounded-xl p-3"><p class="font-bold text-xs text-white">🎯 AI Scanner Live</p><p id="tick" class="text-emerald-400 text-xs mt-2 font-mono border-l-2 border-emerald-500 pl-2">Waiting for ticks...</p><div id="grid" class="grid grid-cols-5 gap-2 mt-3"></div><div class="grid grid-cols-2 gap-2 mt-3"><div class="bg-black border border-[#222] rounded-xl p-2 text-center"><p class="text-[10px] text-gray-400">EVEN</p><p id="even" class="text-emerald-400 font-bold">0%</p></div><div class="bg-black border border-[#222] rounded-xl p-2 text-center"><p class="text-[10px] text-gray-400">ODD</p><p id="odd" class="text-red-400 font-bold">0%</p></div></div></div><div class="m-4 bg-[#101010] border border-[#1f1f1f] rounded-xl p-4"><input id="token" placeholder="Deriv API Token" class="w-full bg-black border border-[#222] rounded-xl p-3 text-xs text-white mb-3"><select id="market" class="w-full bg-black border border-[#222] rounded-xl p-3 text-xs text-white mb-3"><option value="R_100">Volatility 100</option><option value="R_10">Vol 10</option><option value="1HZ100V">Vol 100 (1s)</option></select><select id="type" class="w-full bg-black border border-[#222] rounded-xl p-3 text-xs text-white mb-3"><option>Even</option><option>Odd</option><option>Rise</option><option>Fall</option></select><button onclick="alert('Scanner working! Add trade logic next')" class="w-full bg-emerald-500 text-black font-black py-4 rounded-full">▶ START PRINTING</button></div></div><script>let ws,c=Array(10).fill(0),t=0;function connect(){ws=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');ws.onopen=()=>{ws.send(JSON.stringify({ticks_history:document.getElementById('market').value,count:500,end:'latest',style:'ticks'}));ws.send(JSON.stringify({ticks:document.getElementById('market').value,subscribe:1}));};ws.onmessage=(e)=>{let d=JSON.parse(e.data);if(d.tick){let q=d.tick.quote;document.getElementById('tick').innerText='TICK: '+q+' | Digit '+q.toString().slice(-1);let dg=parseInt(q.toString().slice(-1));if(!isNaN(dg)){c[dg]++;t++;draw();}}}}function draw(){let g=document.getElementById('grid');g.innerHTML='';let ev=0,od=0;c.forEach((v,i)=>{let p=t?((v/t*100).toFixed(1)):0;if(i%2==0)ev+=parseFloat(p);else od+=parseFloat(p);g.innerHTML+=`<div class="bg-black border border-[#222] rounded-lg p-2 text-center"><p class="text-white font-bold text-sm">${i}</p><p class="text-cyan-400 text-[10px]">${p}%</p></div>`});document.getElementById('even').innerText=ev.toFixed(1)+'%';document.getElementById('odd').innerText=od.toFixed(1)+'%';}connect();</script></body></html>
