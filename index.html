<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maziwa ULTIMATE V2</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-black flex justify-center"><div class="w-full max-w-[430px] bg-[#0a0a0a] min-h-screen border-x border-[#1a1a1a]">
<div class="p-4 bg-[#0f0f0f] border-b border-[#1f1f1f] flex justify-between items-center"><div><h1 class="font-black text-white text-[19px]">🥛 Maziwa <span class="text-emerald-400">ULTIMATE V2</span></h1><p id="st" class="text-[10px] text-yellow-400">Connecting...</p></div><span class="text-[9px] bg-emerald-500 text-black px-2 py-1 rounded-full font-black">FIXED</span></div>
<div class="grid grid-cols-4 gap-2 p-3"><button onclick="tab('a')" id="tb-a" class="bg-emerald-500 text-black font-black py-2.5 rounded-xl text-[10px]">ANALYZER</button><button onclick="tab('p')" id="tb-p" class="bg-[#1a1a1a] border border-[#222] text-white py-2.5 rounded-xl text-[10px]">PATTERNS</button><button onclick="tab('r')" id="tb-r" class="bg-[#1a1a1a] border border-[#222] text-white py-2.5 rounded-xl text-[10px]">RISK</button><button onclick="tab('b')" id="tb-b" class="bg-[#1a1a1a] border border-[#222] text-white py-2.5 rounded-xl text-[10px]">AUTO BOT</button></div>
<div class="p-3"><select id="mk" class="w-full bg-[#111] border border-[#333] rounded-xl p-3 text-sm text-white"><option value="R_100">Volatility 100</option><option value="R_10">Vol 10</option><option value="1HZ100V">Vol 100 (1s) - FASTEST</option><option value="R_25">Vol 25</option></select><p id="live" class="text-emerald-400 font-mono text-xs mt-2 font-bold">-</p></div>
<div id="pg-a" class="p-3 space-y-3"><div class="bg-gradient-to-br from-[#123524] to-[#0a1a1a] border border-emerald-900/40 rounded-2xl p-4"><p class="text-[11px] text-gray-400">LIVE SIGNAL • <span id="conf" class="text-emerald-400"></span></p><p id="sig" class="font-black text-white text-[20px] mt-1">Loading...</p><button onclick="analyze()" class="w-full mt-3 bg-emerald-500 text-black font-black py-3 rounded-full">🔍 SCAN NOW</button></div><div class="grid grid-cols-2 gap-2"><div class="bg-[#111] border border-[#222] rounded-xl p-3"><p class="text-[10px] text-gray-400">EVEN</p><p id="eP" class="text-white font-black text-2xl">0%</p><div class="h-1 bg-[#222] rounded-full mt-2"><div id="eB" class="h-1 bg-emerald-500 rounded-full" style="width:0%"></div></div><button onclick="manualTrade('EVEN')" class="w-full mt-2 bg-[#1a1a1a] border border-[#333] text-white text-[10px] py-2 rounded-full font-bold">BUY EVEN</button></div><div class="bg-[#111] border border-[#222] rounded-xl p-3"><p class="text-[10px] text-gray-400">ODD</p><p id="oP" class="text-white font-black text-2xl">0%</p><div class="h-1 bg-[#222] rounded-full mt-2"><div id="oB" class="h-1 bg-red-500 rounded-full" style="width:0%"></div></div><button onclick="manualTrade('ODD')" class="w-full mt-2 bg-[#1a1a1a] border border-[#333] text-white text-[10px] py-2 rounded-full font-bold">BUY ODD</button></div><div class="bg-[#111] border border-[#222] rounded-xl p-3"><p class="text-[10px] text-gray-400">MATCHES</p><p id="mP" class="text-white font-black text-2xl">0%</p><button class="w-full mt-2 bg-[#1a1a1a] border border-[#333] text-white text-[10px] py-2 rounded-full font-bold">BUY MATCH</button></div><div class="bg-[#111] border border-[#222] rounded-xl p-3"><p class="text-[10px] text-gray-400">DIFFERS</p><p id="dP" class="text-white font-black text-2xl">0%</p><button class="w-full mt-2 bg-[#1a1a1a] border border-[#333] text-white text-[10px] py-2 rounded-full font-bold">BUY DIFFER</button></div><div class="bg-[#111] border border-[#222] rounded-xl p-3"><p class="text-[10px] text-gray-400">OVER 4</p><p id="ovP" class="text-white font-black text-xl">0%</p></div><div class="bg-[#111] border border-[#222] rounded-xl p-3"><p class="text-[10px] text-gray-400">UNDER 4</p><p id="unP" class="text-white font-black text-xl">0%</p></div></div><div class="bg-[#111] border border-[#222] rounded-xl p-3"><p class="text-xs font-bold text-white">Last 20 Digits</p><div id="last" class="flex flex-wrap gap-1.5 mt-2"></div><div id="grid" class="grid grid-cols-5 gap-1.5 mt-3"></div></div></div>
<div id="pg-p" class="hidden p-3 space-y-3"><div class="bg-[#141414] border border-[#222] rounded-xl p-4"><p class="text-xs font-bold text-white">🔥 Streak</p><p id="streak" class="text-sm text-emerald-400 mt-2 font-bold">-</p></div><div class="bg-[#141414] border border-[#222] rounded-xl p-4"><p class="text-xs font-bold text-white">❄️ Cold Digits</p><p id="cold" class="text-sm text-white mt-2">-</p><p id="hot" class="text-xs text-cyan-400 mt-1"></p></div><div class="bg-[#141414] border border-[#222] rounded-xl p-4"><p class="text-xs font-bold text-white">📈 Rise/Fall</p><p id="trend" class="text-sm text-white mt-2">-</p><p id="rf" class="text-xs text-gray-400"></p></div></div>
<div id="pg-r" class="hidden p-3"><div class="bg-[#111] border border-[#222] rounded-xl p-4 space-y-3"><p class="text-sm font-black text-white">🛡️ Risk</p><input id="stake" value="0.35" class="w-full bg-black border border-[#333] rounded-xl p-3 text-white text-sm"><div class="flex gap-2"><input id="sl" value="10" placeholder="SL $" class="w-1/2 bg-black border border-[#333] rounded-xl p-3 text-white text-sm"><input id="tp" value="20" placeholder="TP $" class="w-1/2 bg-black border border-[#333] rounded-xl p-3 text-white text-sm"></div><select id="martVal" class="w-full bg-black border border-[#333] rounded-xl p-3 text-white text-sm"><option value="2.1">Martingale x2.1</option><option value="2.3">x2.3</option></select></div></div>
<div id="pg-b" class="hidden p-3 space-y-3"><div class="bg-[#111] border border-[#222] rounded-xl p-4"><input id="token" placeholder="Deriv API Token" class="w-full bg-black border border-[#333] rounded-xl p-3 text-xs text-white"><div class="grid grid-cols-2 gap-2 mt-3"><button onclick="startAuto()" class="bg-emerald-500 text-black font-black py-3 rounded-full text-xs">START AUTO</button><button onclick="stopAuto()" class="bg-[#222] text-red-400 py-3 rounded-full text-xs">STOP</button></div><p id="autoStat" class="text-[11px] text-gray-400 mt-2 text-center">Bot stopped</p></div><div class="bg-[#111] border border-[#222] rounded-xl p-3"><p class="text-xs font-bold text-white">History</p><div id="hist" class="text-[11px] text-gray-400 mt-2">No trades</div></div></div>
</div><script>
let t=[],c=Array(10).fill(0),ws,auto=false,autoInt=null,retry=0;
function tab(n){['a','p','r','b'].forEach(x=>{document.getElementById('pg-'+x).classList.add('hidden'); document.getElementById('tb-'+x).className='bg-[#1a1a1a] border border-[#222] text-white py-2.5 rounded-xl text-[10px]';}); document.getElementById('pg-'+n).classList.remove('hidden'); document.getElementById('tb-'+n).className='bg-emerald-500 text-black font-black py-2.5 rounded-xl text-[10px]';}
function conn(){let m=document.getElementById('mk').value; if(ws)ws.close(); t=[]; c=Array(10).fill(0); document.getElementById('st').innerText='Connecting '+m+'... attempt '+(retry+1); ws=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089'); ws.onopen=()=>{console.log('open'); ws.send(JSON.stringify({ticks_history:m,count:100,end:'latest',style:'ticks'})); ws.send(JSON.stringify({ticks:m,subscribe:1})); retry=0;}; ws.onmessage=(e)=>{let d=JSON.parse(e.data); if(d.history && d.history.prices){document.getElementById('st').innerText='Loaded '+d.history.prices.length+' ticks LIVE - '+m+' ✅'; d.history.prices.forEach(p=>{let dg=parseInt(String(p).slice(-1)); if(!isNaN(dg)){t.push(dg); c[dg]++;}}); upd(); analyze();} if(d.tick){let q=d.tick.quote; let dg=parseInt(String(q).slice(-1)); document.getElementById('live').innerText='LIVE '+q+' | Digit '+dg; t.push(dg); if(t.length>100)t.shift(); if(!isNaN(dg))c[dg]++; upd();} if(d.error){document.getElementById('st').innerText='Error: '+d.error.message;}}; ws.onerror=(e)=>{document.getElementById('st').innerText='WS Error - retrying...'; setTimeout(()=>{retry++; conn();},2000);}; ws.onclose=()=>{document.getElementById('st').innerText='Disconnected - reconnecting...'; setTimeout(()=>{retry++; conn();},2000);};}
function upd(){let tot=t.length||1; let g=document.getElementById('grid'); g.innerHTML=''; for(let i=0;i<10;i++){let p=(c[i]/tot*100).toFixed(1); g.innerHTML+=`<div class="bg-black border border-[#222] rounded-lg p-1.5 text-center"><p class="text-white font-bold text-xs">${i}</p><p class="text-cyan-400 text-[9px]">${p}%</p></div>`;} document.getElementById('last').innerHTML=t.slice(-20).map(x=>`<span class="w-7 h-7 rounded-full bg-[#1e1e1e] border border-[#333] flex items-center justify-center text-white text-xs font-bold">${x}</span>`).join(''); let even=t.filter(x=>x%2==0).length; let tot2=t.length||1; let last3=t.slice(-3); if(last3.length==3 && last3.every(x=>x%2==0))document.getElementById('streak').innerText='🔥 3x EVEN in a row! BUY ODD next'; else if(last3.length==3 && last3.every(x=>x%2==1))document.getElementById('streak').innerText='🔥 3x ODD in a row! BUY EVEN next'; else document.getElementById('streak').innerText='Even '+((even/tot2*100).toFixed(0))+'% / Odd '+((1-even/tot2)*100).toFixed(0))+'%'; let cold=[]; c.forEach((v,i)=>{if(v==0)cold.push(i);}); document.getElementById('cold').innerText=cold.length?'Cold: '+cold.join(', '):'All digits seen'; document.getElementById('hot').innerText='Hot: '+c.indexOf(Math.max(...c))+' ('+Math.max(...c)+'x)'; let rise=0,fall=0; for(let i=1;i<t.length;i++){if(t[i]>t[i-1])rise++; else if(t[i]<t[i-1])fall++;} document.getElementById('trend').innerText=rise>fall?'BULLISH ↑':'BEARISH ↓'; document.getElementById('rf').innerText='Rise '+rise+' | Fall '+fall;}
function analyze(){let tot=t.length; if(tot<10){document.getElementById('sig').innerText='Wait '+tot+'/100 ticks...'; return;} let even=t.filter(x=>x%2==0).length; let odd=tot-even; let over=t.filter(x=>x>4).length; let under=tot-over; let mt=0; for(let i=1;i<t.length;i++)if(t[i]==t[i-1])mt++; let df=tot-1-mt; document.getElementById('eP').innerText=(even/tot*100).toFixed(1)+'%'; document.getElementById('oP').innerText=(odd/tot*100).toFixed(1)+'%'; document.getElementById('mP').innerText=(mt/(tot-1)*100).toFixed(1)+'%'; document.getElementById('dP').innerText=(df/(tot-1)*100).toFixed(1)+'%'; document.getElementById('ovP').innerText=(over/tot*100).toFixed(1)+'%'; document.getElementById('unP').innerText=(under/tot*100).toFixed(1)+'%'; document.getElementById('eB').style.width=(even/tot*100)+'%'; document.getElementById('oB').style.width=(odd/tot*100)+'%'; let best=even>odd?'EVEN':'ODD'; let conf=Math.max(even,odd)/tot*100; if(df/(tot-1)*100>78){best='MATCHES DUE'; conf=df/(tot-1)*100;} document.getElementById('sig').innerText='BUY '+best; document.getElementById('conf').innerText=conf.toFixed(1)+'% confidence'; if(auto && conf>75)addHist('SIGNAL '+best+' '+conf.toFixed(0)+'%');}
function manualTrade(t){addHist(t+' $'+document.getElementById('stake').value);}function startAuto(){auto=true; document.getElementById('autoStat').innerText='🟢 RUNNING'; addHist('Bot started'); if(autoInt)clearInterval(autoInt); autoInt=setInterval(analyze,3000);}function stopAuto(){auto=false; clearInterval(autoInt); document.getElementById('autoStat').innerText='🔴 Stopped'; addHist('Bot stopped');}function addHist(tx){let h=document.getElementById('hist'); h.innerHTML='<div>['+new Date().toLocaleTimeString()+'] '+tx+'</div>'+h.innerHTML;}
document.getElementById('mk').addEventListener('change',conn); conn(); setInterval(analyze,2000);
</script></body></html>
