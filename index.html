<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maziwa V3 WORKING</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-black flex justify-center"><div class="w-full max-w-[430px] bg-[#0a0a0a] min-h-screen">
<div class="p-4 flex justify-between items-center"><h1 class="font-black text-white">🥛 Maziwa <span class="text-emerald-400">V3 WORKING</span></h1><span id="mode" class="text-[9px] bg-yellow-500 text-black px-2 py-1 rounded-full font-black">LIVE</span></div><p id="st" class="px-4 text-[11px] text-yellow-400">Connecting to Deriv...</p><p id="live" class="px-4 text-emerald-400 text-xs font-mono font-bold mt-1">-</p>
<div class="p-3"><select id="mk" class="w-full bg-[#111] border border-[#333] rounded-xl p-3 text-white text-sm"><option value="R_100">Vol 100 (Try 1s if fails)</option><option value="1HZ100V">Vol 100 (1s) - FASTEST</option><option value="R_10">Vol 10</option></select></div>
<div class="p-3 space-y-3"><div class="bg-[#123524] border border-emerald-900/40 rounded-2xl p-4"><p class="text-[11px] text-gray-400">SIGNAL <span id="conf"></span></p><p id="sig" class="font-black text-white text-xl mt-1">Waiting...</p><button onclick="analyze()" class="w-full mt-3 bg-emerald-500 text-black font-black py-3 rounded-full">🔍 SCAN NOW</button></div><div class="grid grid-cols-2 gap-2"><div class="bg-[#111] border border-[#222] rounded-xl p-3"><p class="text-[10px] text-gray-400">EVEN</p><p id="eP" class="text-white font-black text-2xl">0%</p><div class="h-1 bg-[#222] rounded-full mt-2"><div id="eB" class="h-1 bg-emerald-500 rounded-full" style="width:0%"></div></div></div><div class="bg-[#111] border border-[#222] rounded-xl p-3"><p class="text-[10px] text-gray-400">ODD</p><p id="oP" class="text-white font-black text-2xl">0%</p><div class="h-1 bg-[#222] rounded-full mt-2"><div id="oB" class="h-1 bg-red-500 rounded-full" style="width:0%"></div></div></div><div class="bg-[#111] border border-[#222] rounded-xl p-3"><p class="text-[10px] text-gray-400">MATCHES</p><p id="mP" class="text-white font-black text-2xl">0%</p></div><div class="bg-[#111] border border-[#222] rounded-xl p-3"><p class="text-[10px] text-gray-400">DIFFERS</p><p id="dP" class="text-white font-black text-2xl">0%</p></div><div class="bg-[#111] border border-[#222] rounded-xl p-3"><p class="text-[10px] text-gray-400">OVER 4</p><p id="ovP" class="text-white font-black text-xl">0%</p></div><div class="bg-[#111] border border-[#222] rounded-xl p-3"><p class="text-[10px] text-gray-400">UNDER 4</p><p id="unP" class="text-white font-black text-xl">0%</p></div></div><div class="bg-[#111] border border-[#222] rounded-xl p-3"><p class="text-xs font-bold text-white">Last 20 Digits</p><div id="last" class="flex flex-wrap gap-1.5 mt-2"></div><div id="grid" class="grid grid-cols-5 gap-1.5 mt-3"></div></div>
<div class="grid grid-cols-4 gap-2"><button onclick="tab('p')" class="bg-[#1a1a1a] border border-[#222] text-white py-2 rounded-xl text-[10px]">PATTERNS</button><button onclick="tab('r')" class="bg-[#1a1a1a] border border-[#222] text-white py-2 rounded-xl text-[10px]">RISK</button><button onclick="tab('b')" class="bg-[#1a1a1a] border border-[#222] text-white py-2 rounded-xl text-[10px]">AUTO BOT</button><button onclick="location.reload()" class="bg-[#222] text-white py-2 rounded-xl text-[10px]">RELOAD</button></div>
<div id="extra" class="space-y-3 hidden"><div class="bg-[#141414] border border-[#222] rounded-xl p-3"><p id="streak" class="text-sm text-emerald-400 font-bold">-</p><p id="cold" class="text-xs text-white mt-2">-</p><p id="trend" class="text-xs text-gray-400 mt-1">-</p></div><div class="bg-[#111] border border-[#222] rounded-xl p-3"><input id="stake" value="0.35" class="w-full bg-black border border-[#333] rounded-xl p-3 text-white text-sm mb-2"><input id="token" placeholder="Deriv Token" class="w-full bg-black border border-[#333] rounded-xl p-3 text-xs text-white"></div></div>
</div></div><script>
let t=[],c=Array(10).fill(0),ws,simInt=null,connected=false;
function tab(x){document.getElementById('extra').classList.toggle('hidden');}
function conn(){let m=document.getElementById('mk').value; if(ws)ws.close(); if(simInt)clearInterval(simInt); t=[]; c=Array(10).fill(0); connected=false; document.getElementById('st').innerText='Connecting '+m+'...'; document.getElementById('mode').innerText='CONNECTING'; document.getElementById('mode').className='text-[9px] bg-yellow-500 text-black px-2 py-1 rounded-full font-black';
 try{ws=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089'); ws.onopen=()=>{ws.send(JSON.stringify({ticks_history:m,count:100,end:'latest',style:'ticks'})); ws.send(JSON.stringify({ticks:m,subscribe:1})); document.getElementById('st').innerText='Connected - loading...';}; ws.onmessage=(e)=>{let d=JSON.parse(e.data); if(d.history){d.history.prices.forEach(p=>{let dg=parseInt(String(p).slice(-1)); if(!isNaN(dg)){t.push(dg); c[dg]++;}}); connected=true; document.getElementById('st').innerText='✅ LIVE - '+t.length+' ticks from Deriv - '+m; document.getElementById('mode').innerText='LIVE DERIV'; document.getElementById('mode').className='text-[9px] bg-emerald-500 text-black px-2 py-1 rounded-full font-black'; upd(); analyze(); if(simInt)clearInterval(simInt);} if(d.tick){let q=d.tick.quote; let dg=parseInt(String(q).slice(-1)); document.getElementById('live').innerText='LIVE '+q+' | Digit '+dg; t.push(dg); if(t.length>100)t.shift(); if(!isNaN(dg))c[dg]++; upd();}}; ws.onerror=()=>{startSim('Deriv blocked - using SIM mode');}; ws.onclose=()=>{if(!connected)startSim('Disconnected - SIM mode');};}catch(e){startSim('Error - SIM mode');}
 setTimeout(()=>{if(!connected){startSim('Deriv slow - switched to SIM to show tools');}},4000);
}
function startSim(reason){if(connected)return; if(simInt)return; document.getElementById('st').innerText='⚠️ '+reason+' - Analyzer ina-work na demo ticks'; document.getElementById('mode').innerText='SIM MODE'; document.getElementById('mode').className='text-[9px] bg-orange-500 text-black px-2 py-1 rounded-full font-black'; simInt=setInterval(()=>{let dg=Math.floor(Math.random()*10); t.push(dg); if(t.length>100)t.shift(); c[dg]++; let price=(1000+Math.random()*100).toFixed(2); document.getElementById('live').innerText='SIM '+price+' | Digit '+dg; upd(); analyze();},800); for(let i=0;i<30;i++){let dg=Math.floor(Math.random()*10); t.push(dg); c[dg]++;} upd(); analyze();}
function upd(){let tot=t.length||1; let g=document.getElementById('grid'); g.innerHTML=''; for(let i=0;i<10;i++){let p=(c[i]/tot*100).toFixed(1); g.innerHTML+=`<div class="bg-black border border-[#222] rounded-lg p-1.5 text-center"><p class="text-white font-bold text-xs">${i}</p><p class="text-cyan-400 text-[9px]">${p}%</p></div>`;} document.getElementById('last').innerHTML=t.slice(-20).map(x=>`<span class="w-7 h-7 rounded-full bg-[#1e1e1e] border border-[#333] flex items-center justify-center text-white text-xs font-bold">${x}</span>`).join(''); let even=t.filter(x=>x%2==0).length; document.getElementById('streak').innerText='Even '+((even/tot*100).toFixed(0))+'% Odd '+((100-even/tot*100).toFixed(0))+'% | Last 3: '+t.slice(-3).join(','); let cold=[]; c.forEach((v,i)=>{if(v<2)cold.push(i);}); document.getElementById('cold').innerText='Cold: '+cold.join(', ')+' | Hot: '+c.indexOf(Math.max(...c)); let rise=0,fall=0; for(let i=1;i<t.length;i++){if(t[i]>t[i-1])rise++; else if(t[i]<t[i-1])fall++;} document.getElementById('trend').innerText='Rise '+rise+' Fall '+fall+' '+(rise>fall?'BULLISH':'BEARISH');}
function analyze(){let tot=t.length; if(tot<5){document.getElementById('sig').innerText='Loading '+tot; return;} let even=t.filter(x=>x%2==0).length; let odd=tot-even; let over=t.filter(x=>x>4).length; let under=tot-over; let mt=0; for(let i=1;i<t.length;i++)if(t[i]==t[i-1])mt++; let df=tot-1-mt; document.getElementById('eP').innerText=(even/tot*100).toFixed(1)+'%'; document.getElementById('oP').innerText=(odd/tot*100).toFixed(1)+'%'; document.getElementById('mP').innerText=(mt/(tot-1)*100).toFixed(1)+'%'; document.getElementById('dP').innerText=(df/(tot-1)*100).toFixed(1)+'%'; document.getElementById('ovP').innerText=(over/tot*100).toFixed(1)+'%'; document.getElementById('unP').innerText=(under/tot*100).toFixed(1)+'%'; document.getElementById('eB').style.width=(even/tot*100)+'%'; document.getElementById('oB').style.width=(odd/tot*100)+'%'; let best=even>odd?'EVEN '+ (even/tot*100).toFixed(0)+'%':'ODD '+ (odd/tot*100).toFixed(0)+'%'; if(df/(tot-1)*100>75)best='MATCH DUE - '+(df/(tot-1)*100).toFixed(0)+'% DIFFERS'; document.getElementById('sig').innerText='BUY '+best; document.getElementById('conf').innerText=(Math.max(even,odd)/tot*100).toFixed(1)+'% conf';}
document.getElementById('mk').addEventListener('change',conn); conn();
</script></body></html>
