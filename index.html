<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maziwa Analyzer PRO</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#030a06] flex justify-center"><div class="w-full max-w-[430px] bg-[#0a0a0a] min-h-screen">
<div class="p-5"><h1 class="font-black text-white text-[22px]">🥛 Maziwa <span class="text-emerald-400">ANALYZER</span> PRO</h1><p class="text-[10px] text-gray-400">Deriv Digit Analyzer • Matches / Differs • Even/Odd</p></div>

<div class="mx-4 p-4 rounded-[16px] bg-[#111] border border-[#222]"><div class="flex justify-between items-center"><p class="text-xs font-bold text-white">Select Market</p><span id="tick" class="text-[10px] bg-emerald-900 text-emerald-400 px-2 py-1 rounded-full">LIVE</span></div><select id="market" class="w-full mt-2 bg-black border border-[#333] rounded-xl p-3 text-sm text-white"><option value="R_100">Volatility 100 Index</option><option value="R_10">Volatility 10</option><option value="1HZ100V">Vol 100 (1s)</option><option value="1HZ10V">Vol 10 (1s)</option><option value="R_25">Volatility 25</option></select>
<div class="grid grid-cols-3 gap-2 mt-3"><button onclick="setAnalysis('evenodd')" class="bg-[#1a1a1a] border border-[#333] rounded-xl py-2.5 text-[11px] font-bold text-white">EVEN / ODD</button><button onclick="setAnalysis('matches')" class="bg-emerald-900/30 border border-emerald-700 rounded-xl py-2.5 text-[11px] font-bold text-emerald-400">MATCH / DIFFER</button><button onclick="setAnalysis('overunder')" class="bg-[#1a1a1a] border border-[#333] rounded-xl py-2.5 text-[11px] font-bold text-white">OVER / UNDER</button></div>
<button onclick="analyze()" class="w-full mt-3 bg-gradient-to-r from-emerald-400 to-emerald-600 text-black font-black py-3 rounded-full text-sm">🔍 ANALYZE LAST 100 TICKS</button>
</div>

<div class="m-4 p-4 rounded-[16px] bg-gradient-to-br from-[#123524] to-[#0a1a1a] border border-emerald-900/40"><p class="text-[11px] text-gray-400">ANALYSIS RESULT</p><p id="signal" class="font-black text-white text-[18px] mt-1">Press ANALYZE to scan</p><p id="confidence" class="text-emerald-400 text-xs mt-1"></p>
<div class="grid grid-cols-2 gap-3 mt-4">
<div class="bg-black/50 border border-[#222] rounded-xl p-3"><p class="text-[10px] text-gray-400">EVEN</p><p id="evenP" class="text-white font-black text-xl">0%</p><div class="h-1 bg-[#222] rounded-full mt-2"><div id="evenBar" class="h-1 bg-emerald-500 rounded-full" style="width:0%"></div></div></div>
<div class="bg-black/50 border border-[#222] rounded-xl p-3"><p class="text-[10px] text-gray-400">ODD</p><p id="oddP" class="text-white font-black text-xl">0%</p><div class="h-1 bg-[#222] rounded-full mt-2"><div id="oddBar" class="h-1 bg-red-500 rounded-full" style="width:0%"></div></div></div>
<div class="bg-black/50 border border-[#222] rounded-xl p-3"><p class="text-[10px] text-gray-400">MATCHES</p><p id="matchP" class="text-white font-black text-xl">0%</p></div>
<div class="bg-black/50 border border-[#222] rounded-xl p-3"><p class="text-[10px] text-gray-400">DIFFERS</p><p id="diffP" class="text-white font-black text-xl">0%</p></div>
<div class="bg-black/50 border border-[#222] rounded-xl p-3"><p class="text-[10px] text-gray-400">OVER 4</p><p id="overP" class="text-white font-black text-xl">0%</p></div>
<div class="bg-black/50 border border-[#222] rounded-xl p-3"><p class="text-[10px] text-gray-400">UNDER 4</p><p id="underP" class="text-white font-black text-xl">0%</p></div>
</div>
</div>

<div class="m-4 bg-[#111] border border-[#222] rounded-xl p-3"><p class="text-xs font-bold text-white">Last 20 Digits</p><div id="digits" class="flex gap-1.5 mt-2 flex-wrap"></div>
<div id="grid" class="grid grid-cols-5 gap-2 mt-4"></div>
</div>

<div class="m-4 bg-[#101010] border border-[#1f1f1f] rounded-xl p-4"><input id="token" placeholder="Deriv API Token (optional for auto-trade)" class="w-full bg-black border border-[#222] rounded-xl p-3 text-xs text-white mb-3"><div class="grid grid-cols-2 gap-3"><button onclick="trade('DIGITEVEN')" class="bg-emerald-500 text-black font-black py-3 rounded-full text-xs">BUY EVEN</button><button onclick="trade('DIGITODD')" class="bg-[#222] border border-[#333] text-white font-black py-3 rounded-full text-xs">BUY ODD</button><button onclick="trade('DIGITMATCH')" class="bg-[#222] border border-[#333] text-white font-black py-3 rounded-full text-xs">BUY MATCHES</button><button onclick="trade('DIGITDIFF')" class="bg-[#222] border border-[#333] text-white font-black py-3 rounded-full text-xs">BUY DIFFERS</button></div></div>

</div><script>
let ws, ticks=[], counts=Array(10).fill(0);
function connect(){let m=document.getElementById('market').value; if(ws)ws.close(); ticks=[]; counts=Array(10).fill(0); ws=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089'); ws.onopen=()=>{ws.send(JSON.stringify({ticks_history:m,count:100,end:'latest',style:'ticks'})); ws.send(JSON.stringify({ticks:m,subscribe:1}));}; ws.onmessage=(e)=>{let d=JSON.parse(e.data); if(d.history){d.history.prices.forEach(p=>{let dg=parseInt(p.toString().slice(-1)); ticks.push(dg); if(!isNaN(dg))counts[dg]++;}); draw();} if(d.tick){let q=d.tick.quote; let dg=parseInt(q.toString().slice(-1)); ticks.push(dg); if(ticks.length>100)ticks.shift(); if(!isNaN(dg)){counts[dg]++;} draw();}};}
function draw(){let gd=document.getElementById('grid'); gd.innerHTML=''; let tot=ticks.length||1; counts.forEach((v,i)=>{let p=((v/tot*100).toFixed(1)); gd.innerHTML+=`<div class="bg-black border border-[#222] rounded-lg p-1.5 text-center"><p class="text-white font-bold text-xs">${i}</p><p class="text-cyan-400 text-[9px]">${p}%</p></div>`}); document.getElementById('digits').innerHTML=ticks.slice(-20).map(d=>`<span class="w-7 h-7 rounded-full bg-[#1a1a1a] border border-[#333] flex items-center justify-center text-xs text-white font-bold">${d}</span>`).join('');}
function analyze(){let tot=ticks.length; if(tot<20)return alert('Wait for ticks to load'); let even=ticks.filter(d=>d%2==0).length; let odd=tot-even; let over=ticks.filter(d=>d>4).length; let under=tot-over; let matches=0; for(let i=1;i<ticks.length;i++)if(ticks[i]==ticks[i-1])matches++; let differs=tot-1-matches;
document.getElementById('evenP').innerText=(even/tot*100).toFixed(1)+'%'; document.getElementById('oddP').innerText=(odd/tot*100).toFixed(1)+'%'; document.getElementById('overP').innerText=(over/tot*100).toFixed(1)+'%'; document.getElementById('underP').innerText=(under/tot*100).toFixed(1)+'%'; document.getElementById('matchP').innerText=(matches/(tot-1)*100).toFixed(1)+'%'; document.getElementById('diffP').innerText=(differs/(tot-1)*100).toFixed(1)+'%';
document.getElementById('evenBar').style.width=(even/tot*100)+'%'; document.getElementById('oddBar').style.width=(odd/tot*100)+'%';
let best=''; let conf=0; if(even>odd){best='EVEN'; conf=even/tot*100;}else{best='ODD'; conf=odd/tot*100;} if((matches/(tot-1)*100)>65){best='DIFFERS - Wait for MATCH'; conf=matches/(tot-1)*100;}
document.getElementById('signal').innerText='SIGNAL: BUY '+best; document.getElementById('confidence').innerText='Confidence: '+conf.toFixed(1)+'% • Based on last '+tot+' ticks';
}
function setAnalysis(t){analyze();} function trade(t){alert('Trade: '+t+' - Add your Deriv API buy logic here');}
document.getElementById('market').addEventListener('change',connect); connect();
</script></body></html>
