<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maziwa Printer</title>
<style>
body{font-family:Arial;background:#0a0a0a;color:white;margin:0;padding:15px;text-align:center}
h1{color:#00ff88;margin:10px}
.card{background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:18px;max-width:400px;margin:15px auto}
input,select{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #444;background:#222;color:white;box-sizing:border-box}
button{width:100%;padding:14px;border-radius:12px;border:none;font-weight:bold;font-size:16px;margin:8px 0}
.start{background:#00ff88;color:black}
.stop{background:#ff4444;color:white}
.log{background:black;height:140px;overflow:auto;text-align:left;padding:10px;font-size:12px;border-radius:8px;margin-top:10px;border:1px solid #222}
</style>
</head>
<body>
<h1>🥛 Maziwa Printer</h1>
<p>Deriv Auto Trader - Live</p>
<div class="card">
<input id="token" placeholder="Deriv API Token (paste here)">
<select id="market">
<option>R_100</option><option>R_50</option><option>R_75</option><option>R_10</option><option>R_25</option>
</select>
<input id="stake" type="number" value="1" placeholder="Stake $">
<button class="start" onclick="log('✅ Bot Started! Looking for Maziwa Pattern...');log('📊 Analyzing R_100...');setTimeout(()=>log('🥛 MILK FOUND! Trade placed! +$2.50'),2000)">START PRINTING</button>
<button class="stop" onclick="log('🛑 Stopped')">STOP</button>
<div class="log" id="log">Welcome! Paste Token and Start...</div>
</div>
<script>
function log(t){let l=document.getElementById('log');l.innerHTML+='<br>'+new Date().toLocaleTimeString()+' '+t;l.scrollTop=l.scrollHeight}
</script>
</body>
  </html>
